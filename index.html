<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176b50">
  <title>زاد الحفّاظ</title>
  <style>
    :root{font-family:Tahoma,"Segoe UI",sans-serif;color:#19352b;background:#f4f3ec}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#f7f5eb,#e8f0e9);min-height:100vh}.app{max-width:900px;margin:auto;padding:24px}.header,.tabs,.row,.meta,.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.header{margin-bottom:20px}.header h1{margin:0;color:#176b50}.header p{margin:6px 0;color:#69766f}.tabs{justify-content:flex-start;margin:20px 0}.tabs button,.btn{border:0;border-radius:12px;padding:12px 17px;font-weight:700;cursor:pointer;background:#e4e9df;color:#19352b}.tabs button.active,.btn.primary{background:#176b50;color:white}.btn.good{background:#329677;color:white}.btn.warn{background:#d59a34;color:#fff}.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 10px 28px #173e2912;margin:16px 0}.meta{color:#68756f;font-size:.92rem}.text{font-size:1.55rem;line-height:2.1;white-space:pre-line;margin:20px 0}.hidden{display:none}.actions{justify-content:flex-start;margin-top:16px}.section{display:none}.section.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}.stat{background:#fff;border-radius:16px;padding:20px;box-shadow:0 8px 20px #173e2910}.stat span{display:block;color:#69766f}.stat strong{display:block;font-size:1.8rem;color:#176b50;margin-top:8px}ul{padding:0;list-style:none}li{padding:13px;margin:9px 0;border-radius:10px;background:#f3f5ef}.note{font-size:.9rem;color:#66736c}@media(max-width:600px){.app{padding:15px}.header{align-items:flex-start}.text{font-size:1.3rem}}
  </style>
</head>
<body>
  <main class="app">
    <header class="header"><div><h1>زاد الحفّاظ</h1><p>رفيقك في حفظ القرآن الكريم والحديث الشريف</p></div><button class="btn" id="reset">إعادة ضبط</button></header>
    <nav class="tabs" aria-label="الأقسام"><button class="active" data-tab="quran">القرآن</button><button data-tab="hadith">الحديث</button><button data-tab="review">المراجعة</button><button data-tab="stats">الإحصائيات</button></nav>
    <section class="section active" id="quran"><div class="row"><h2>حفظ القرآن</h2><button class="btn primary" id="nextQ">عنصر آخر</button></div><article class="card"><div class="meta"><span id="qMeta"></span><span id="qLevel"></span></div><h3 id="qTitle"></h3><p class="text hidden" id="qText"></p><button class="btn" id="showQ">إظهار النص</button></article><div class="actions"><button class="btn good" data-rate="easy">حفظت جيدًا</button><button class="btn primary" data-rate="medium">أحتاج مراجعة بسيطة</button><button class="btn warn" data-rate="hard">أحتاج مراجعة</button></div></section>
    <section class="section" id="hadith"><div class="row"><h2>حفظ الحديث</h2><button class="btn primary" id="nextH">حديث آخر</button></div><article class="card"><div class="meta"><span id="hMeta"></span><span id="hLevel"></span></div><h3 id="hTitle"></h3><p class="text hidden" id="hText"></p><button class="btn" id="showH">إظهار النص</button></article><div class="actions"><button class="btn good" data-rate-h="easy">حفظت جيدًا</button><button class="btn primary" data-rate-h="medium">أحتاج مراجعة بسيطة</button><button class="btn warn" data-rate-h="hard">أحتاج مراجعة</button></div><p class="note">تحقق من نص الحديث وتخريجه من مصدر موثوق مع معلّم أو مرجع معتمد.</p></section>
    <section class="section" id="review"><h2>المراجعة المستحقة</h2><div class="card"><ul id="dueList"></ul></div></section>
    <section class="section" id="stats"><h2>إحصائياتك</h2><div class="grid"><div class="stat"><span>مقاطع القرآن</span><strong id="qCount">0</strong></div><div class="stat"><span>الأحاديث</span><strong id="hCount">0</strong></div><div class="stat"><span>مراجعات مستحقة</span><strong id="dueCount">0</strong></div><div class="stat"><span>تقدم الخطة</span><strong id="progress">0%</strong></div></div></section>
  </main>
<script>
const KEY='zadAlHafazState';
const initial={quran:[{id:'q1',title:'سورة الفاتحة',meta:'الفاتحة — الآيات ١–٧',text:'بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ ۝ الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ ۝ الرَّحْمَٰنِ الرَّحِيمِ ۝ مَالِكِ يَوْمِ الدِّينِ ۝ إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ ۝ اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ ۝ صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ',level:1,nextReview:0},{id:'q2',title:'سورة الإخلاص',meta:'الإخلاص — الآيات ١–٤',text:'قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ',level:1,nextReview:0}],hadith:[{id:'h1',title:'فضل طلب العلم',meta:'صحيح مسلم — راجع المصدر للتخريج',text:'مَن سَلَكَ طريقًا يَلتَمِسُ فيه علمًا، سَهَّلَ اللهُ له به طريقًا إلى الجنة.',level:1,nextReview:0},{id:'h2',title:'التحذير من الغفلة',meta:'صحيح البخاري — راجع المصدر للتخريج',text:'لا يُلدَغُ المؤمنُ من جُحرٍ واحدٍ مرتين.',level:1,nextReview:0}],history:[]};
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x&&Array.isArray(x.quran)&&Array.isArray(x.hadith)?x:structuredClone(initial)}catch{return structuredClone(initial)}}let state=load(),qi=0,hi=0;
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function getDue(){return [...state.quran,...state.hadith].filter(x=>(x.nextReview||0)<=Date.now())}
function renderQ(){const x=state.quran[qi%state.quran.length];qTitle.textContent=x.title;qMeta.textContent=x.meta;qLevel.textContent='مستوى الحفظ: '+x.level;qText.textContent=x.text;qText.classList.add('hidden');showQ.textContent='إظهار النص'}function renderH(){const x=state.hadith[hi%state.hadith.length];hTitle.textContent=x.title;hMeta.textContent=x.meta;hLevel.textContent='مستوى الحفظ: '+x.level;hText.textContent=x.text;hText.classList.add('hidden');showH.textContent='إظهار النص'}
function stats(){const due=getDue(),total=state.quran.length+state.hadith.length;dueList.innerHTML='';if(!due.length){dueList.innerHTML='<li>لا توجد مراجعات مستحقة الآن. أحسنت!</li>'}else due.forEach(x=>{const li=document.createElement('li');li.textContent=(x.title||'عنصر')+' — مستوى '+x.level;dueList.appendChild(li)});qCount.textContent=state.quran.length;hCount.textContent=state.hadith.length;dueCount.textContent=due.length;progress.textContent=(total?Math.round((total-due.length)/total*100):0)+'%'}
function rate(item,result){const days=result==='easy'?4:result==='medium'?2:1;item.level=Math.max(1,Math.min(10,item.level+(result==='easy'?1:result==='hard'?-1:0)));item.nextReview=Date.now()+days*86400000;state.history.push({id:item.id,result,at:new Date().toISOString()});save();stats()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.section').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab));stats()});nextQ.onclick=()=>{qi=(qi+1)%state.quran.length;renderQ()};nextH.onclick=()=>{hi=(hi+1)%state.hadith.length;renderH()};showQ.onclick=()=>{qText.classList.toggle('hidden');showQ.textContent=qText.classList.contains('hidden')?'إظهار النص':'إخفاء النص'};showH.onclick=()=>{hText.classList.toggle('hidden');showH.textContent=hText.classList.contains('hidden')?'إظهار النص':'إخفاء النص'};document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{rate(state.quran[qi%state.quran.length],b.dataset.rate);qi=(qi+1)%state.quran.length;renderQ()});document.querySelectorAll('[data-rate-h]').forEach(b=>b.onclick=()=>{rate(state.hadith[hi%state.hadith.length],b.dataset.rateH);hi=(hi+1)%state.hadith.length;renderH()});reset.onclick=()=>{if(confirm('هل تريد حذف تقدمك وإعادة ضبط التطبيق؟')){state=structuredClone(initial);save();qi=hi=0;renderQ();renderH();stats()}};renderQ();renderH();stats();
</script>
</body>
</html>
